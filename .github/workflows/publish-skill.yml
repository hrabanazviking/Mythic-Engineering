name: Publish Mythic Engineering Skill Packages to GitHub Packages

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - claude-code-skill
          - cursor-skill
          - windsurf-skill
          - cline-skill
          - kilocode-skill
          - github-copilot-skill
          - continue-skill
          - aider-skill
          - goose-skill
          - openhands-skill
          - devin-skill
          - amp-skill
          - jetbrains-skill
          - amazon-q-skill
          - zed-skill
          - cody-skill
          - tabnine-skill
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@hrabanazviking'

      - name: Publish ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
